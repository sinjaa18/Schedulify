name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: schedulify_test
          POSTGRES_USER: schedulify_test
          POSTGRES_PASSWORD: schedulify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedulify_test -d schedulify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://schedulify_app:unused@127.0.0.1:5432/schedulify_app
      TEST_DATABASE_URL: postgres://schedulify_test:schedulify_test@127.0.0.1:5432/schedulify_test
      TEST_DATABASE_SSL: "false"
      E2E_DATABASE_URL: postgres://schedulify_test:schedulify_test@127.0.0.1:5432/schedulify_test
      E2E_DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit
      - name: PostgreSQL integration tests
        run: npm run test:db
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end journey
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Preserve browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-artifacts
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
