services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: schedulify_test
      POSTGRES_USER: schedulify_test
      POSTGRES_PASSWORD: schedulify_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulify_test -d schedulify_test"]
      interval: 5s
      timeout: 5s
      retries: 12
